[tool.poetry]
name = "hass-lierda-iot"
version = "2.0.0"
description = "Lierda IoT Home Assistant Integration"
authors = ["qcgzxw"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
homeassistant = "^2024.1.0"
aiohttp = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-homeassistant = "^0.13.0"
pytest-aiohttp = "^1.0.0"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
black = "^24.0.0"
aioresponses = "^0.7.6"
freezegun = "^1.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ['py312']
