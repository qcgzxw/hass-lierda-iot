[tool.poetry]
name = "hass-lierda-iot"
version = "2.0.1"
description = "Lierda IoT Home Assistant Integration"
authors = ["qcgzxw"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
homeassistant = "^2025.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-homeassistant-custom-component = "^0.13.210"
pytest-aiohttp = "^1.0.0"
pytest-cov = "^6.0.0"
mypy = "^1.15.0"
black = "^25.0.0"
aioresponses = "^0.7.6"
freezegun = "^1.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ['py313']
