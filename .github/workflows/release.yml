---
name: Release

on:
  release:
    types: [released]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  generate_zip:
    name: Generate release zip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Check manifest.json version
        id: check_version
        run: |
          # Extract the version from manifest.json
          manifest_version=$(grep -oP '(?<="version": ")[^"]*' custom_components/lierda_iot/manifest.json)
          echo "Manifest.json version: $manifest_version"

          # Extract the release tag
          release_tag="${GITHUB_REF#refs/tags/}"
          echo "Release tag: $release_tag"

          # Check if the versions match
          if [ "$release_tag" != "$manifest_version" ]; then
            echo "Error: Release tag ($release_tag) does not match manifest.json version ($manifest_version)"
            exit 1
          fi

      - name: Zip release file
        run: |
          sudo apt-get update || exit 1
          sudo apt-get install zip || exit 1

          echo "Show runner information"
          hostname
          whoami
          pwd
          uname -a

          echo "Show custom_components directory"
          ls -alht custom_components/lierda_iot/ || exit 1

          echo "Show manifest.json for debug"
          cat custom_components/lierda_iot/manifest.json || exit 1

          dst_dir="/github/workspace/artifacts"
          sudo mkdir -p "$dst_dir" || exit 1
          sudo chown -R "$(id -u):$(id -g)" "$dst_dir" || exit 1
          sudo chmod -R 755 "$dst_dir" || exit 1

          cd custom_components/lierda_iot/ || exit 1
          zip -r ../lierda_iot.zip ./* || exit 1
          cp ../lierda_iot.zip "$dst_dir/" || exit 1

          echo "Show artifacts directory"
          ls -alht "$dst_dir" || exit 1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lierda_iot.zip
          path: /github/workspace/artifacts

  upload_release:
    needs: generate_zip
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: lierda_iot.zip
          merge-multiple: true

      - name: Display Structure of Artifacts Files
        run: ls -R

      - name: Show Working Directory For Debug Purpose
        run: |
          echo "Show runner information"
          hostname
          whoami
          df -h
          pwd
          uname -a
          ls -alht
          ls -alht artifacts || exit 0
          echo "github.ref: ${{github.ref}}"

      - name: Upload to Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/lierda_iot.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
